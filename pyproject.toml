[project]
name = "gmailbot"
version = "2.0.0"
description = "Gmail plus-alias inbox bot with OTP detection for Telegram"
requires-python = ">=3.10"
dependencies = ["python-telegram-bot==22.8", "requests>=2.31"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:gmailbot.*"]

[tool.pyflakes]
